<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VOD Scrapper — review</title>
<style>
  :root {
    --bg: #0e0e12;
    --panel: #17171f;
    --panel-2: #1e1e28;
    --line: #2b2b38;
    --text: #e8e8ef;
    --muted: #9a9aae;
    --accent: #9146ff;
    --good: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    height: 100vh; display: grid; grid-template-columns: 340px 1fr; overflow: hidden;
  }
  h1 { font-size: 15px; margin: 0; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .head { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .list { overflow-y: auto; flex: 1; }
  .item { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; gap: 3px; }
  .item:hover { background: var(--panel-2); }
  .item.active { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .score { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .title { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 999px; background: #2a2a3a; color: var(--muted); }
  .tag.marker { background: #3a2a5a; color: #c9a7ff; }
  .tag.chat { background: #23384a; color: #8fc6f0; }
  .tag.audio { background: #244035; color: #86d6ab; }
  .tag.match_result { background: #4a3320; color: #e5b070; }
  .status { font-size: 11px; }
  .status.approved { color: var(--good); }
  .status.rejected { color: var(--bad); }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; min-height: 0; padding: 10px; }
  video { max-width: 100%; max-height: 100%; background: #000; }
  .controls { padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); display: grid; gap: 10px; }
  .track { position: relative; height: 34px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; overflow: hidden; }
  .sel { position: absolute; top: 0; bottom: 0; background: rgba(145,70,255,.28); border-left: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  .play { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; }
  .grid { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button.on { border-color: var(--accent); color: #c9a7ff; }
  input[type=text] {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font: inherit; flex: 1; min-width: 200px;
  }
  .why { color: var(--muted); font-size: 12px; }
  kbd { background: #2a2a3a; border-radius: 4px; padding: 0 5px; font-size: 11px; font-family: ui-monospace, monospace; }
  .warn { background: #2b2313; border: 1px solid #4a3a15; color: #e5c07b; padding: 8px 12px; border-radius: 6px; font-size: 12px; margin: 10px 16px 0; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<aside>
  <div class="head">
    <h1>Review queue</h1>
    <div class="sub" id="sessionInfo">loading…</div>
  </div>
  <div class="list" id="list"></div>
</aside>

<main>
  <div class="bar">
    <strong id="candTitle">—</strong>
    <span class="meta" id="candMeta"></span>
    <span style="flex:1"></span>
    <button id="btnH" class="on">16:9</button>
    <button id="btnV">9:16</button>
  </div>

  <div id="warnings"></div>

  <div class="stage"><video id="player" controls preload="auto"></video></div>

  <div class="controls">
    <div class="why" id="why"></div>
    <div class="track" id="track">
      <div class="sel" id="sel"></div>
      <div class="play" id="playhead"></div>
    </div>
    <div class="grid">
      <button id="setIn">Set in <kbd>I</kbd></button>
      <button id="setOut">Set out <kbd>O</kbd></button>
      <span class="meta" id="bounds"></span>
      <span style="flex:1"></span>
      <span class="meta">audio:</span>
      <button class="audio on" data-track="2">mic</button>
      <button class="audio on" data-track="3">game</button>
      <button class="audio on" data-track="4">party</button>
    </div>
    <div class="grid">
      <input type="text" id="title" placeholder="Title for the clip" />
      <button class="primary" id="approve">Approve <kbd>A</kbd></button>
      <button class="danger" id="reject">Reject <kbd>X</kbd></button>
    </div>
    <div class="why">
      <kbd>J</kbd>/<kbd>L</kbd> scrub · <kbd>K</kbd> or <kbd>Space</kbd> play ·
      <kbd>I</kbd>/<kbd>O</kbd> in/out · <kbd>↑</kbd>/<kbd>↓</kbd> candidate ·
      <kbd>A</kbd> approve · <kbd>X</kbd> reject
    </div>
    <div class="why" id="queue"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let session = null, cands = [], current = -1, orientation = "horizontal";
let audioTracks = new Set([2, 3, 4]);

const fmt = (s) => {
  s = Math.max(0, s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = Math.floor(s % 60);
  return (h ? `${h}:${String(m).padStart(2, "0")}` : `${m}`) + `:${String(x).padStart(2, "0")}`;
};

// Mirrors the server's preview window so trim offsets line up with the proxy.
function previewStart(c) {
  return Math.max(0, c.start - session.context_pre);
}
function previewEnd(c) {
  const raw = Math.min(session.duration, c.end + session.context_post);
  return Math.min(raw, previewStart(c) + 300);
}

async function load() {
  session = await (await fetch("/api/session")).json();
  cands = session.candidates || [];
  $("sessionInfo").textContent =
    `${session.recording_name} · ${fmt(session.duration)} · ${cands.length} candidates`;

  const warn = $("warnings");
  warn.innerHTML = "";
  (session.warnings || []).forEach((w) => {
    const div = document.createElement("div");
    div.className = "warn";
    div.textContent = w;
    warn.appendChild(div);
  });

  renderList();
  if (cands.length) select(0);
  else $("list").innerHTML = '<div class="empty">No candidates in this session.</div>';
}

function renderList() {
  const list = $("list");
  list.innerHTML = "";
  cands.forEach((c, i) => {
    const el = document.createElement("div");
    el.className = "item" + (i === current ? " active" : "");
    const tags = (c.sources || []).map((s) => `<span class="tag ${s}">${s}</span>`).join("");
    const status = c.status
      ? `<span class="status ${c.status}">${c.status}</span>` : "";
    el.innerHTML = `
      <div class="row"><span class="score">${c.score.toFixed(0)}</span>${status}</div>
      <div class="title">${c.title || c.evidence?.llm_reason || "(untitled)"}</div>
      <div class="row"><span class="meta">${fmt(c.start)} · ${c.duration.toFixed(1)}s</span></div>
      <div class="tags">${tags}</div>`;
    el.onclick = () => select(i);
    list.appendChild(el);
  });
}

function select(i) {
  if (i < 0 || i >= cands.length) return;
  current = i;
  const c = cands[i];
  renderList();
  document.querySelectorAll(".item")[i]?.scrollIntoView({ block: "nearest" });

  $("candTitle").textContent = c.title || "(untitled)";
  $("candMeta").textContent = `${fmt(c.start)} → ${fmt(c.end)} · score ${c.score.toFixed(1)}`;
  $("title").value = c.title || "";
  $("why").textContent = explain(c);
  $("player").src = `/api/candidates/${i}/preview?orientation=${orientation}`;
  $("player").load();
  drawTrack();
}

function explain(c) {
  const e = c.evidence || {}, bits = [];
  if (e.marker) bits.push(`you marked this (${e.category || "general"})`);
  if (e.chat_z) bits.push(`chat ${e.chat_z}σ above baseline, ${e.messages} msgs, ${e.laugh_emotes || 0} laughs, ${e.clip_calls || 0} clip calls`);
  if (e.above_baseline_db) bits.push(`mic +${e.above_baseline_db}dB for ${e.sustained_seconds}s${e.from_silence ? " out of silence" : ""}`);
  if (e.kills !== undefined && e.kills !== null) bits.push(`match #${e.match_index}: ${e.kills} kills, ${e.survived ? "extracted" : "died"}`);
  if (e.llm_reason) bits.push(e.llm_reason);
  return bits.join(" · ") || "no evidence recorded";
}

function drawTrack() {
  const c = cands[current];
  if (!c) return;
  const p0 = previewStart(c), span = Math.max(0.1, previewEnd(c) - p0);
  const sel = $("sel");
  sel.style.left = `${((c.start - p0) / span) * 100}%`;
  sel.style.width = `${((c.end - c.start) / span) * 100}%`;
  $("bounds").textContent = `in ${fmt(c.start)} · out ${fmt(c.end)} · ${(c.end - c.start).toFixed(1)}s`;
}

$("player").addEventListener("timeupdate", () => {
  const c = cands[current];
  if (!c) return;
  const span = Math.max(0.1, previewEnd(c) - previewStart(c));
  $("playhead").style.left = `${($("player").currentTime / span) * 100}%`;
});

$("track").onclick = (ev) => {
  const c = cands[current];
  if (!c) return;
  const rect = ev.currentTarget.getBoundingClientRect();
  const span = previewEnd(c) - previewStart(c);
  $("player").currentTime = ((ev.clientX - rect.left) / rect.width) * span;
};

async function save(patch) {
  const c = cands[current];
  Object.assign(c, patch);
  c.duration = Math.max(0, c.end - c.start);
  await fetch(`/api/candidates/${current}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(patch),
  });
  drawTrack();
  renderList();
}

function setIn() {
  const c = cands[current];
  const t = previewStart(c) + $("player").currentTime;
  if (t < c.end) save({ start: t });
}
function setOut() {
  const c = cands[current];
  const t = previewStart(c) + $("player").currentTime;
  if (t > c.start) save({ end: t });
}

$("setIn").onclick = setIn;
$("setOut").onclick = setOut;
$("title").onchange = () => save({ title: $("title").value });

document.querySelectorAll(".audio").forEach((btn) => {
  btn.onclick = () => {
    const t = Number(btn.dataset.track);
    if (audioTracks.has(t)) { audioTracks.delete(t); btn.classList.remove("on"); }
    else { audioTracks.add(t); btn.classList.add("on"); }
    save({ audio_tracks: [...audioTracks].sort() });
  };
});

function setOrientation(o) {
  orientation = o;
  $("btnH").classList.toggle("on", o === "horizontal");
  $("btnV").classList.toggle("on", o === "vertical");
  if (current >= 0) select(current);
}
$("btnH").onclick = () => setOrientation("horizontal");
$("btnV").onclick = () => setOrientation("vertical");

$("approve").onclick = async () => {
  await save({ status: "approved", audio_tracks: [...audioTracks].sort() });
  await fetch(`/api/candidates/${current}/approve`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ orientations: ["horizontal", "vertical"] }),
  });
  pollQueue();
  if (current + 1 < cands.length) select(current + 1);
};

$("reject").onclick = async () => {
  await save({ status: "rejected" });
  if (current + 1 < cands.length) select(current + 1);
};

async function pollQueue() {
  const q = await (await fetch("/api/queue")).json();
  if (!q.length) return;
  const done = q.filter((t) => t.status === "done").length;
  const failed = q.filter((t) => t.status === "failed");
  let text = `renders: ${done}/${q.length} done`;
  if (failed.length) text += ` · ${failed.length} failed (${failed[0].error})`;
  $("queue").textContent = text;
  if (q.some((t) => t.status === "queued" || t.status === "rendering")) {
    setTimeout(pollQueue, 2000);
  }
}

document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "INPUT") return;
  const v = $("player");
  const keys = {
    j: () => (v.currentTime -= 2),
    l: () => (v.currentTime += 2),
    k: () => (v.paused ? v.play() : v.pause()),
    " ": () => (v.paused ? v.play() : v.pause()),
    i: setIn,
    o: setOut,
    a: () => $("approve").click(),
    x: () => $("reject").click(),
    arrowleft: () => (v.currentTime -= 0.2),
    arrowright: () => (v.currentTime += 0.2),
    arrowup: () => select(current - 1),
    arrowdown: () => select(current + 1),
  };
  const fn = keys[ev.key.toLowerCase()];
  if (fn) { ev.preventDefault(); fn(); }
});

load();
</script>
</body>
</html>

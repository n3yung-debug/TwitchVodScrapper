[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vodscrapper"
version = "0.1.0"
description = "Turn Twitch streams into clips: hotkey markers, chat/audio detection, post-match stats, vertical renders."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Installed on the streaming PC. Split out so the analysis box and the
# marker daemon do not have to drag in torch.
daemon = [
    "keyboard>=0.13.5",
    "pystray>=0.19",
    "pillow>=10.0",
]
analyze = [
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "anthropic>=0.40",
]
ocr = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "paddleocr>=2.7",
]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vodscrap = "vodscrapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vodscrapper = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
